let currentIdx = 0, score = 0;
function loadQ() {
    let q = questions[currentIdx];
    document.getElementById('question-text').innerText = (currentIdx + 1) + ". " + q.question;
    document.getElementById('page-info').innerText = "صفحة " + q.page + " - سؤال " + q.q_num + " - اجتهاد شخصي";
    let tip = document.getElementById('book-tip');
    if(q.isBook) { tip.style.display = "block"; tip.innerText = "انظر للكتاب صفحة " + q.page + " - سؤال " + q.q_num; } else { tip.style.display = "none"; }
    let cont = document.getElementById('options-container'); cont.innerHTML = '';
    q.options.forEach(o => {
        let btn = document.createElement('button'); btn.innerText = o;
        btn.onclick = () => {
            let f = document.getElementById('feedback'); f.style.display = "block";
            if(o === q.answer) { score += 10; f.style.backgroundColor = "#d4edda"; f.innerText = "صح! " + q.exp; }
            else { f.style.backgroundColor = "#f8d7da"; f.innerText = "خطأ. " + q.exp; }
            document.getElementById('points').innerText = score;
            document.getElementById('next-btn').style.display = "block";
        };
        cont.appendChild(btn);
    });
}
function nextQuestion() {
    currentIdx++;
    if(currentIdx < questions.length) { document.getElementById('feedback').style.display = "none"; document.getElementById('next-btn').style.display = "none"; loadQ(); }
    else { document.body.innerHTML = "<h1>انتهى التحدي! مجموع نقاطك: " + score + " من " + (questions.length * 10) + "</h1>"; }
}
loadQ();
</script>
