<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شعار قناة QuizToon</title>
<style>
  body {
    background-color: #121212;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  canvas {
    width: 320px;
    height: 320px;
    border-radius: 50%;
    box-shadow: 0 10px 30px rgba(0, 195, 255, 0.5);
    margin-bottom: 25px;
    border: 4px solid #fff;
  }
  .btn {
    background: linear-gradient(45deg, #00c853, #64dd17);
    color: #fff;
    border: none;
    padding: 15px 35px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0, 200, 83, 0.4);
    transition: transform 0.2s;
  }
  .btn:hover {
    transform: scale(1.05);
  }
</style>
</head>
<body>

  <h2>شعار قناة QuizToon الجاهز لليوتيوب</h2>
  <!-- لوحة الرسم بدقة 800x800 المخصصة ليوتيوب -->
  <canvas id="logoCanvas" width="800" height="800"></canvas>
  <button class="btn" onclick="downloadLogo()">⬇️ تحميل الشعار كصورة (PNG)</button>

<script>
const canvas = document.getElementById('logoCanvas');
const ctx = canvas.getContext('2d');

// 1. رسم الخلفية المتدرجة (أزرق ملكي وسماوي مشع)
const bgGrad = ctx.createRadialGradient(400, 400, 50, 400, 400, 450);
bgGrad.addColorStop(0, '#00e5ff');
bgGrad.addColorStop(0.5, '#0066ff');
bgGrad.addColorStop(1, '#001a66');
ctx.fillStyle = bgGrad;
ctx.fillRect(0, 0, 800, 800);

// 2. رسم دوائر إضاءة خلفية خفيفة
ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
ctx.beginPath();
ctx.arc(400, 360, 260, 0, Math.PI * 2);
ctx.fill();

// 3. دالة رسم النجوم اللامعة
function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
  let rot = Math.PI / 2 * 3;
  let x = cx;
  let y = cy;
  let step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    ctx.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;
}

drawStar(160, 220, 5, 35, 15, '#ffd700');
drawStar(650, 200, 5, 45, 20, '#ffd700');
drawStar(140, 480, 4, 25, 10, '#ffffff');
drawStar(670, 460, 4, 30, 12, '#ffffff');

// 4. رسم علامة الاستفهام ثلاثية الأبعاد (؟)
ctx.save();
ctx.font = '900 380px "Arial Rounded MT Bold", "Helvetica Rounded", Arial, sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';

// ظل ثلاثي الأبعاد للعلامة
ctx.fillStyle = '#cc5200';
ctx.fillText('?', 412, 345);

// حدود سوداء/بيضاء لإبراز العلامة
ctx.lineWidth = 22;
ctx.strokeStyle = '#ffffff';
ctx.strokeText('?', 400, 330);

// تدرج ذهبي برتقالي لعلامة الاستفهام
const qGrad = ctx.createLinearGradient(400, 150, 400, 500);
qGrad.addColorStop(0, '#fffb00');
qGrad.addColorStop(0.5, '#ffaa00');
qGrad.addColorStop(1, '#ff5500');
ctx.fillStyle = qGrad;
ctx.fillText('?', 400, 330);
ctx.restore();

// 5. رسم شريط الاسم (QuizToon)
ctx.save();
// خلفية الشريط
ctx.fillStyle = '#ff0055';
ctx.strokeStyle = '#ffffff';
ctx.lineWidth = 10;
ctx.beginPath();
ctx.roundRect(140, 540, 520, 125, 60);
ctx.fill();
ctx.stroke();

// كتابة اسم القناة QuizToon
ctx.font = '900 90px "Arial Rounded MT Bold", Arial, sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillStyle = '#ffffff';
ctx.shadowColor = 'rgba(0,0,0,0.4)';
ctx.shadowBlur = 10;
ctx.shadowOffsetY = 5;
ctx.fillText('QuizToon', 400, 605);
ctx.restore();

// وظيفة تحميل الصورة
function downloadLogo() {
  const link = document.createElement('a');
  link.download = 'QuizToon_Logo.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
