let currentIdx = 0;
function showQuestion() {
    let q = questions[currentIdx];
    document.getElementById('question').innerText = q.question;
    document.getElementById('page-info').innerText = "صفحة " + q.page + " - سؤال " + q.q_num + " - اجتهاد شخصي";
    let ops = document.getElementById('options'); ops.innerHTML = '';
    q.options.forEach(opt => {
        let btn = document.createElement('button'); btn.innerText = opt;
        btn.onclick = () => {
            let f = document.getElementById('feedback');
            f.style.backgroundColor = (opt === q.answer ? "#d4edda" : "#f8d7da");
            f.innerText = (opt === q.answer ? "صح! " : "خطأ. ") + q.explanation;
            document.getElementById('next-btn').style.display = 'block';
        };
        ops.appendChild(btn);
    });
}
function nextQuestion() {
    currentIdx++;
    if(currentIdx < questions.length) {
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').style.backgroundColor = 'transparent';
        document.getElementById('next-btn').style.display = 'none';
        showQuestion();
    } else { document.body.innerHTML = "<h1>خلصت التحدي يا بطل!</h1>"; }
}
